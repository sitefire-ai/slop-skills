<title>Deslop Run Report</title>
<!-- PROTOTYPE, throwaway. Question: what should the deslop-structure run report look like?
     Three layouts (A, B, C) x three run states (start, running, done), switched from the bottom bar or with #A-start style links.
     Sample run on an example post. Map positions are illustrative: the Slop API v1 response has no map coordinates yet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one report column (max 1080px); figures are white plates on a warm-grey ground, like the Slop Checker result page. */
:root {
  --bg: #f4f3f1;
  --surface: #ffffff;
  --plate: #fbfaf9;
  --ink: #171717;
  --ink-2: #4f4d4a;
  --muted: #76736f;
  --line: rgba(23, 23, 23, 0.09);
  --line-strong: rgba(23, 23, 23, 0.18);
  --human: #e8532b;
  --human-soft: rgba(251, 95, 53, 0.11);
  --ai: #5d6e93;
  --ai-soft: rgba(103, 120, 155, 0.12);
  --mid: #8d8a85;
  --ring: rgba(23, 23, 23, 0.35);
  --bar: #171717;
  --bar-ink: #f4f3f1;
  --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1b1b1a; --plate: #171716; --ink: #f1f0ee; --ink-2: #c4c1bc; --muted: #94918c;
    --line: rgba(241, 240, 238, 0.10); --line-strong: rgba(241, 240, 238, 0.22);
    --human: #ff7a55; --human-soft: rgba(255, 122, 85, 0.14); --ai: #93a3c8; --ai-soft: rgba(147, 163, 200, 0.14);
    --mid: #a3a09a; --ring: rgba(241, 240, 238, 0.45); --bar: #f1f0ee; --bar-ink: #121211; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1b1b1a; --plate: #171716; --ink: #f1f0ee; --ink-2: #c4c1bc; --muted: #94918c;
  --line: rgba(241, 240, 238, 0.10); --line-strong: rgba(241, 240, 238, 0.22);
  --human: #ff7a55; --human-soft: rgba(255, 122, 85, 0.14); --ai: #93a3c8; --ai-soft: rgba(147, 163, 200, 0.14);
  --mid: #a3a09a; --ring: rgba(241, 240, 238, 0.45); --bar: #f1f0ee; --bar-ink: #121211; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 120px; display: grid; gap: 16px; }
.proto-note { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 8px 12px; }
.eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: 22px; line-height: 1.25; }
h2 { font-size: 16px; }
h3 { font-size: 15px; }
p { margin: 0; }
.card { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 18px; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 9px; font-size: 12px; line-height: 1.3; white-space: nowrap; box-shadow: 0 0 0 1px var(--line); color: var(--ink-2); background: var(--surface); }
.chip .sw { width: 7px; height: 7px; border-radius: 50%; }
.band-human_shaped .sw, .sw.human_shaped { background: var(--human); }
.band-borderline .sw, .sw.borderline { background: var(--mid); }
.band-ai_shaped .sw, .sw.ai_shaped { background: var(--ai); }
.kind { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 5px; padding: 2px 6px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-2); white-space: nowrap; }
.kind.needs_author_input { box-shadow: inset 0 0 0 1px var(--human); color: var(--human); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

/* current P(AI) readout */
.readout { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.readout .big { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.readout .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

/* map */
.map-box { position: relative; aspect-ratio: 8 / 5; width: 100%; max-width: 100%; }
.map-plate { position: absolute; inset: 0; overflow: hidden; border-radius: 10px; background: var(--plate); box-shadow: 0 0 0 1px var(--line); }
.map-plate img { width: 100%; height: 100%; display: block; object-fit: fill; }
.map-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.map-line polyline { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.map-dot { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); background: var(--ink); color: var(--surface); font: 600 11px/18px var(--font-mono); text-align: center; padding: 0; cursor: default; box-shadow: 0 0 0 1px var(--ring); }
.map-dot.cur { width: 28px; height: 28px; line-height: 24px; font-size: 12px; }
.map-dot.human_shaped { background: var(--human); }
.map-dot.ai_shaped { background: var(--ai); }
.map-dot.borderline { background: var(--mid); }
.map-dot:focus-visible, .hit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.map-pending { position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; border: 2px dashed var(--ink); pointer-events: none; }
.map-group { position: absolute; top: 92%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); background: var(--surface); border-radius: 999px; padding: 3px 8px; box-shadow: 0 0 0 1px var(--line); white-space: nowrap; }
.map-group .sw { width: 6px; height: 6px; border-radius: 50%; }

/* chart */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.chart .zone-h { fill: var(--human-soft); }
.chart .zone-a { fill: var(--ai-soft); }
.chart .grid { stroke: var(--line-strong); stroke-dasharray: 3 4; }
.chart .axis { stroke: var(--line-strong); }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.chart .line.pending { stroke-dasharray: 4 5; stroke: var(--muted); }
.chart .pt { stroke: var(--surface); stroke-width: 2.5; }
.chart .pt.human_shaped { fill: var(--human); }
.chart .pt.borderline { fill: var(--mid); }
.chart .pt.ai_shaped { fill: var(--ai); }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 500; }
.chart .slot { stroke: var(--line-strong); stroke-dasharray: 2 4; }
.chart .zl { font-size: 10px; letter-spacing: 0.05em; }
.chart .goal { stroke: var(--human); stroke-width: 1.5; stroke-dasharray: 6 4; }
.chart .goal-t { fill: var(--human); }
.track-goal { position: absolute; top: 6px; bottom: 6px; width: 2px; background: var(--human); transform: translateX(-1px); }

/* shared highlight */
[data-round].hi .map-dot, .map-dot.hi { box-shadow: 0 0 0 4px var(--ring); }
.chart .pt.hi { stroke: var(--ink); }
.round.hi, .tl-item.hi .tl-card, td.hi, th.hi { background: color-mix(in oklab, var(--ink) 5%, var(--surface)); }

/* tooltip */
#tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; line-height: 1.4; border-radius: 8px; padding: 7px 10px; max-width: 260px; }
#tip b { font-weight: 600; }

/* rounds (plan) */
.rounds { display: grid; gap: 12px; }
.round { border-radius: 10px; box-shadow: 0 0 0 1px var(--line); padding: 14px 16px; display: grid; gap: 10px; background: var(--surface); }
.round-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.moves { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.move { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; }
.move .kind { grid-row: span 2; margin-top: 2px; }
.move .what { color: var(--ink-2); font-size: 13.5px; min-width: 0; }
.move .what b { color: var(--ink); font-weight: 500; }
.move .instr { font-size: 14px; min-width: 0; }
.fromto { color: var(--muted); font-size: 13px; }
.round-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; }
.delta { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.btn { font: 500 13.5px/1 var(--font-body); border-radius: 8px; padding: 9px 14px; border: 0; cursor: pointer; background: var(--ink); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.offer { display: grid; gap: 10px; }
.offer.rec { box-shadow: 0 0 0 1.5px var(--ink); }
.conflict { font-size: 13px; color: var(--human); }
.keep { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.keep li { display: flex; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.keep li::before { content: "✓"; color: var(--muted); }
.manager { border-left: 3px solid var(--ink); padding: 2px 0 2px 12px; font-size: 14px; }

/* variant A */
.a-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: end; }
.a-figs { display: grid; gap: 16px; }

/* variant B */
.b-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.b-aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 16px; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 40px minmax(0, 1fr); }
.tl-rail { position: relative; display: flex; justify-content: center; }
.tl-rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line-strong); }
.tl-item:first-child .tl-rail::before { top: 18px; }
.tl-item:last-child .tl-rail::before { bottom: calc(100% - 18px); }
.tl-node { position: relative; margin-top: 8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bg); background: var(--ink); color: var(--surface); font: 600 11px/18px var(--font-mono); text-align: center; }
.tl-node.human_shaped { background: var(--human); } .tl-node.ai_shaped { background: var(--ai); } .tl-node.borderline { background: var(--mid); }
.tl-node.pending { background: var(--surface); color: var(--ink); border: 2px dashed var(--ink); }
.tl-card { margin: 0 0 14px; border-radius: 10px; padding: 12px 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); display: grid; gap: 10px; }
.tl-p { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

/* variant C */
.track { position: relative; height: 34px; margin-top: 18px; }
.track-bar { position: absolute; left: 0; right: 0; top: 13px; height: 8px; border-radius: 4px; display: flex; overflow: hidden; }
.track-bar span:nth-child(1) { flex: 30; background: var(--human-soft); box-shadow: inset 0 0 0 1px var(--human); }
.track-bar span:nth-child(2) { flex: 40; background: color-mix(in oklab, var(--mid) 14%, transparent); }
.track-bar span:nth-child(3) { flex: 30; background: var(--ai-soft); box-shadow: inset 0 0 0 1px var(--ai); }
.track-mark { position: absolute; top: 17px; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); background: var(--muted); }
.track-mark.cur { width: 20px; height: 20px; background: var(--ink); box-shadow: 0 0 0 1px var(--ring); }
.track-lbl { position: absolute; top: -16px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--ink); white-space: nowrap; }
.track-scale { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.c-figs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.mx-wrap { overflow-x: auto; }
table.mx { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13.5px; }
.mx th, .mx td { text-align: left; vertical-align: top; padding: 10px 10px; border-bottom: 1px solid var(--line); }
.mx thead th { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.mx thead th .num { display: block; color: var(--ink); font-size: 13px; text-transform: none; letter-spacing: 0; }
.mx td.cell { min-width: 150px; }
.mx td.cell .to { color: var(--ink); }
.mx details summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.mx details p { margin-top: 4px; font-size: 13px; }
.mx .empty { color: var(--line-strong); }

/* switcher */
.switch { position: fixed; z-index: 40; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; background: var(--bar); color: var(--bar-ink); border-radius: 999px; padding: 6px 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25); font: 500 12.5px/1 var(--font-mono); max-width: calc(100% - 24px); }
.switch button { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 999px; padding: 7px 10px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); }
.switch button:focus-visible { outline: 2px solid var(--bar-ink); outline-offset: 1px; }
.switch .sep { width: 1px; height: 18px; background: currentColor; opacity: 0.3; }
.switch .vlabel { padding: 0 4px; min-width: 120px; text-align: center; }

@media (max-width: 760px) {
  .b-grid, .c-figs { grid-template-columns: minmax(0, 1fr); }
  .b-aside { position: static; }
  .a-top { grid-template-columns: minmax(0, 1fr); }
  .readout .big { font-size: 38px; }
  .switch .vlabel { min-width: 0; }
}
</style>

<div class="wrap">
  <p class="proto-note">Prototype · 3 layouts × 3 run states · sample run on an example post. Map positions are illustrative: the Slop API v1 response has no map coordinates yet.</p>
  <main id="app"></main>
</div>
<div id="tip" hidden></div>
<nav class="switch" aria-label="Prototype controls">
  <button type="button" id="prev" aria-label="Previous layout">←</button>
  <span class="vlabel" id="vlabel"></span>
  <button type="button" id="next" aria-label="Next layout">→</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-state="start" aria-pressed="false">Start</button>
  <button type="button" data-state="running" aria-pressed="false">Running</button>
  <button type="button" data-state="done" aria-pressed="false">Done</button>
</nav>

    moves: [
      { f: "AUD_STK_005", what: "Stakes escalation", from: "present", to: "absent", kind: "local",
        instr: "Cut the paragraph that escalates from setup friction to company-wide failure, and keep the practical cost." },
    ],
    fidelity: "14 of 14 claims kept" },
];

const OFFERED = [
  { id: "A", mix: "2 local + 1 structural", reaches: true, rec: true,
    why: "Needs no input from you and keeps the section order.", moves: ROUNDS[1].moves },
  { id: "B", mix: "1 local + 2 author input", reaches: true,
    why: "Needs two links from you: a demo and a customer story.",
    moves: [
      ROUNDS[1].moves[0],
      { f: "VOC_PRT_005", what: "A way for readers to take part", from: "absent", to: "link to docs or a demo", kind: "needs_author_input", instr: "Add one link where readers can try the product or read more." },
      { f: "EVD_CAS_002", what: "Named customer evidence", from: "absent", to: "one named customer example", kind: "needs_author_input", instr: "Add one real customer example with the customer's name and result." },
    ] },
  { id: "C", mix: "3 structural", reaches: true, conflict: "Conflicts with a known constraint: keep the existing section order (from your brief).",
    why: "Reorders the post around the problem.",
    moves: [
      ROUNDS[1].moves[2],
      { f: "AUD_PRB_002", what: "Where the core problem is stated", from: "title or first sentence", to: "after the first example", kind: "structural", instr: "Move the problem statement after the first worked example." },
      { f: "STR_FLW_005", what: "Legacy-versus-modern contrast", from: "yes", to: "no", kind: "structural", instr: "Remove the old-way versus new-way framing and describe the options on their own terms." },
    ] },
];

const KEEP = [
  { what: "States limits of its advice", value: "explicit caveats present" },
  { what: "Uses first-hand experience", value: "the team's own migration" },
  { what: "Names its intended reader", value: "data and ops leads" },
];

const bandOf = (p) => (p < 0.3 ? "human_shaped" : p < 0.7 ? "borderline" : "ai_shaped");
const BAND_NAME = { human_shaped: "Human-shaped", borderline: "Borderline", ai_shaped: "AI-shaped" };
const pct = (p) => `${Math.round(p * 100)}%`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KIND = { local: "local", structural: "structural", needs_author_input: "author input" };

function view(state) {
  if (state === "start") return { state, measured: ROUNDS.slice(0, 1), pending: null, offered: OFFERED,
    status: "Goal: P(AI) under 20%. Waiting for you to confirm a Path" };
  if (state === "running") return { state, measured: ROUNDS.slice(0, 2), pending: { ...ROUNDS[2], stage: "Rewriting" },
    status: "Round 2 of 3 · rewriting along Path A" };
  return { state, measured: ROUNDS, pending: null,
    status: "Done · goal of under 20% reached in round 3" };
}
const current = (v) => v.measured[v.measured.length - 1];
const fx = (x) => (x - AXIS.x[0]) / (AXIS.x[1] - AXIS.x[0]);
const fy = (y) => 1 - (y - AXIS.y[0]) / (AXIS.y[1] - AXIS.y[0]);

function bandChip(p) {
  const b = bandOf(p);
  return `<span class="chip band-${b}"><span class="sw"></span>${BAND_NAME[b]}</span>`;
}
function readout(v, big = true) {
  const c = current(v);
  return `<div class="readout"><span class="lbl">P(AI) now</span><span class="${big ? "big" : "tl-p"} num">${pct(c.p)}</span>${bandChip(c.p)}</div>
    <p class="muted" style="font-size:13px">Measured by the Slop API after round ${c.n}${v.pending ? ` · round ${v.pending.n} is running` : ""}</p>`;
}

function mapFig(v, caption = true) {
  const pts = v.measured;
  const line = pts.map((r) => `${(fx(r.x) * 100).toFixed(2)},${(fy(r.y) * 100).toFixed(2)}`).join(" ");
  const last = pts[pts.length - 1];
  const dots = pts.map((r) => `<button type="button" class="map-dot hit ${bandOf(r.p)}${r === last ? " cur" : ""}" data-round="${r.n}"
      style="left:${(fx(r.x) * 100).toFixed(2)}%;top:${(fy(r.y) * 100).toFixed(2)}%" aria-label="Round ${r.n}, P(AI) ${pct(r.p)}">${r.n}</button>`).join("");
  const pend = v.pending ? `<span class="map-pending pulse" style="left:${(fx(last.x) * 100).toFixed(2)}%;top:${(fy(last.y) * 100).toFixed(2)}%"></span>` : "";
  return `<figure style="margin:0">
    <div class="map-box">
      <div class="map-plate"><img src="${CLOUD}" alt="" width="1400" height="875"></div>
      <svg class="map-line" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${line}" vector-effect="non-scaling-stroke"/></svg>
      ${pend}${dots}
      <span class="map-group" style="left:${GROUPS.ai * 100}%"><span class="sw" style="background:var(--ai)"></span>AI posts (5 models)</span>
      <span class="map-group" style="left:${GROUPS.human * 100}%"><span class="sw" style="background:var(--human)"></span>Human posts</span>
    </div>
    ${caption ? `<figcaption class="muted" style="font-size:13px;margin-top:10px">Each dot is one version of the post in the study's structural space. 0 is the original.</figcaption>` : ""}
  </figure>`;
}

function chartFig(v, h = 230) {
  const W = 640, H = h, L = 44, R = 18, T = 14, B = 30;
  const xs = (n) => L + (n / MAX_ROUNDS) * (W - L - R);
  const ys = (p) => T + (1 - p) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="P(AI) by round">`;
  s += `<rect class="zone-a" x="${L}" y="${ys(1)}" width="${W - L - R}" height="${ys(0.7) - ys(1)}"/>`;
  s += `<rect class="zone-h" x="${L}" y="${ys(0.3)}" width="${W - L - R}" height="${ys(0) - ys(0.3)}"/>`;
  for (const t of [0.3, 0.7]) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${ys(t)}" y2="${ys(t)}"/>`;
  s += `<line class="goal" x1="${L}" x2="${W - R}" y1="${ys(GOAL)}" y2="${ys(GOAL)}"/><text class="zl goal-t" x="${L + 6}" y="${ys(GOAL) - 5}">GOAL UNDER ${GOAL * 100}%</text>`;
  for (const t of [0, 0.2, 0.3, 0.7, 1]) s += `<text x="${L - 8}" y="${ys(t) + 4}" text-anchor="end">${t * 100}%</text>`;
  s += `<text class="zl" x="${W - R - 6}" y="${ys(1) + 14}" text-anchor="end">AI-SHAPED</text>`;
  s += `<text class="zl" x="${W - R - 6}" y="${ys(0) - 7}" text-anchor="end">HUMAN-SHAPED</text>`;
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${ys(0)}" y2="${ys(0)}"/>`;
  for (let n = 0; n <= MAX_ROUNDS; n++) {
    const done = v.measured.some((r) => r.n === n);
    if (!done) s += `<line class="slot" x1="${xs(n)}" x2="${xs(n)}" y1="${ys(1)}" y2="${ys(0)}"/>`;
    s += `<text x="${xs(n)}" y="${H - 8}" text-anchor="middle">${n === 0 ? "start" : "R" + n}</text>`;
  }
  const pts = v.measured;
  s += `<polyline class="line" points="${pts.map((r) => `${xs(r.n)},${ys(r.p)}`).join(" ")}"/>`;
  const last = pts[pts.length - 1];
  if (v.pending) {
    s += `<text class="pulse" x="${xs(v.pending.n)}" y="${ys(0.5)}" text-anchor="middle">checking…</text>`;
  }
  for (const r of pts) {
    const cur = r === last;
    s += `<circle class="pt hit ${bandOf(r.p)}" data-round="${r.n}" cx="${xs(r.n)}" cy="${ys(r.p)}" r="${cur ? 7 : 5.5}" tabindex="0" aria-label="Round ${r.n}, P(AI) ${pct(r.p)}"/>`;
  }
  const lbl = (r, dy) => `<text class="val" x="${xs(r.n) + (r.n === MAX_ROUNDS ? -10 : 10)}" y="${ys(r.p) + dy}" text-anchor="${r.n === MAX_ROUNDS ? "end" : "start"}">${pct(r.p)}</text>`;
  s += lbl(pts[0], pts[0].p > 0.85 ? 16 : -10);
  if (last !== pts[0]) s += lbl(last, last.p < 0.15 ? -10 : -10);
  return `<div class="chart">${s}</svg></div>`;
}

function moveItem(m) {
  return `<li class="move"><span class="kind ${m.kind}">${KIND[m.kind]}</span>
    <div class="what"><b>${esc(m.what)}</b> <span class="fromto">· ${esc(m.from)} → ${esc(m.to)}</span></div>
    <div class="instr">${esc(m.instr)}${m.input ? `<div class="muted" style="font-size:12.5px;margin-top:2px">Author input: ${esc(m.input)}</div>` : ""}</div></li>`;
}
function delta(prev, r) { return `<span class="delta">${pct(prev.p)} → ${r.p == null ? "…" : pct(r.p)}</span>`; }

function roundBlock(r, prev, pending) {
  return `<article class="round" data-round="${r.n}">
    <div class="round-head"><h3>Round ${r.n} <span class="muted" style="font-weight:400">· Path ${r.path} · ${esc(r.mix)}</span></h3>
      ${pending ? `<span class="chip pulse">${pending.stage}…</span>` : delta(prev, r)}</div>
    <ol class="moves">${r.moves.map(moveItem).join("")}</ol>
    <div class="round-foot"><span>${esc(r.chosen)}</span>${pending ? `<span>Fidelity check and Check follow the rewrite</span>` : `<span>Meaning check: ${esc(r.fidelity)}</span>`}</div>
  </article>`;
}

function offeredBlock(o) {
  return `<article class="round offer${o.rec ? " rec" : ""}">
    <div class="round-head"><h3>Path ${o.id} <span class="muted" style="font-weight:400">· ${esc(o.mix)}</span></h3>
      ${o.rec ? `<span class="chip"><span class="sw" style="background:var(--ink)"></span>Recommended</span>` : ""}</div>
    <p style="font-size:14px">${esc(o.why)}</p>
    ${o.conflict ? `<p class="conflict">${esc(o.conflict)}</p>` : ""}
    <ol class="moves">${o.moves.map(moveItem).join("")}</ol>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${o.conflict ? `<button type="button" class="btn ghost" disabled>Use Path ${o.id}</button>` :
      `<button type="button" class="btn${o.rec ? "" : " ghost"}" data-go="running">Use Path ${o.id}</button>`}</div>
  </article>`;
}

function managerNote(v) {
  if (v.state === "start") return `<p class="manager">The post is AI-shaped. Path A reaches the human band with no input from you. Confirm it, or pick another Path.</p>`;
  if (v.state === "running") return `<p class="manager">Round 1 moved P(AI) from 97% to 71%. Round 2 adds the docs link you confirmed and moves the payoff out of the title.</p>`;
  return `<p class="manager">Human-shaped after round 2 (24%), but still above the goal of 20%, so round 3 ran with one local Move and reached 6%. Goal reached, run stopped.</p>`;
}

function planList(v) {
  if (v.state === "start") return `<section class="card" style="display:grid;gap:12px"><p class="eyebrow">Paths offered by the Slop API</p>${v.offered.map(offeredBlock).join("")}</section>`;
  const items = v.measured.slice(1).map((r, i) => roundBlock(r, v.measured[i]));
  if (v.pending) items.push(roundBlock(v.pending, current(v), v.pending));
  return `<section class="card" style="display:grid;gap:12px"><p class="eyebrow">What each round did</p><div class="rounds">${items.join("")}</div></section>`;
}
function keepList() {
  return `<section class="card" style="display:grid;gap:10px"><p class="eyebrow">Kept on purpose</p><ul class="keep">${KEEP.map((k) => `<li><span><b style="font-weight:500;color:var(--ink)">${esc(k.what)}</b> · ${esc(k.value)}</span></li>`).join("")}</ul></section>`;
}
function postLine() {
  return `<p class="eyebrow">Deslop run · ${POST.words.toLocaleString("en")} words · up to ${MAX_ROUNDS} rounds</p>
    <h1>${esc(POST.title)}</h1><p class="muted" style="font-size:13.5px">${esc(POST.url)}</p>`;
}

/* A: stacked report, in the order the user asked for */
function variantA(v) {
  return `<section class="card a-top"><div style="display:grid;gap:6px;min-width:0">${postLine()}<p style="font-size:14px;margin-top:4px">${esc(v.status)}</p></div>
      <div style="display:grid;gap:4px;justify-items:start">${readout(v)}</div></section>
    ${managerNote(v)}
    <div class="a-figs">
      <section class="card" style="display:grid;gap:12px"><p class="eyebrow">Where the post sits, and how it moved</p>${mapFig(v)}</section>
      <section class="card" style="display:grid;gap:12px"><p class="eyebrow">P(AI) by round</p>${chartFig(v)}</section>
    </div>
    ${planList(v)}${v.state === "start" ? "" : keepList()}`;
}

/* W: the chosen layout. A's stacked report, with B's timeline in place of the round list */
function variantW(v) {
  return `<section class="card a-top"><div style="display:grid;gap:6px;min-width:0">${postLine()}<p style="font-size:14px;margin-top:4px">${esc(v.status)}</p></div>
      <div style="display:grid;gap:4px;justify-items:start">${readout(v)}</div></section>
    ${managerNote(v)}
    <div class="a-figs">
      <section class="card" style="display:grid;gap:12px"><p class="eyebrow">Where the post sits, and how it moved</p>${mapFig(v)}</section>
      <section class="card" style="display:grid;gap:12px"><p class="eyebrow">P(AI) by round</p>${chartFig(v)}</section>
    </div>
    <section style="display:grid;gap:12px;min-width:0"><p class="eyebrow">What each round did</p><ol class="tl">${timelineSteps(v).join("")}</ol></section>
    ${v.state === "start" ? "" : keepList()}`;
}

/* B: timeline on the left, figures pinned on the right */
function variantB(v) {
  const steps = timelineSteps(v);
  return `<header style="display:grid;gap:6px">${postLine()}</header>
    <div class="b-grid">
      <section style="min-width:0;display:grid;gap:12px">${managerNote(v)}<ol class="tl">${steps.join("")}</ol>${v.state === "start" ? "" : keepList()}</section>
      <aside class="b-aside">
        <section class="card" style="display:grid;gap:4px">${readout(v)}<p style="font-size:13.5px">${esc(v.status)}</p></section>
        <section class="card" style="display:grid;gap:10px"><p class="eyebrow">Structural map</p>${mapFig(v, false)}</section>
        <section class="card" style="display:grid;gap:10px"><p class="eyebrow">P(AI) by round</p>${chartFig(v, 200)}</section>
      </aside>
    </div>`;
}

function timelineSteps(v) {
  const steps = [];
  const r0 = v.measured[0];
  steps.push(`<li class="tl-item" data-round="0"><div class="tl-rail"><span class="tl-node ${bandOf(r0.p)}">0</span></div>
    <div class="tl-card"><div class="round-head"><h3>Original post</h3><span class="tl-p num">${pct(r0.p)}</span></div>${bandChip(r0.p)}</div></li>`);
  if (v.state === "start") {
    steps.push(`<li class="tl-item"><div class="tl-rail"><span class="tl-node pending">1</span></div>
      <div class="tl-card"><h3>Choose the Path for round 1</h3>${v.offered.map(offeredBlock).join("")}</div></li>`);
  }
  v.measured.slice(1).forEach((r, i) => {
    const prev = v.measured[i];
    steps.push(`<li class="tl-item" data-round="${r.n}"><div class="tl-rail"><span class="tl-node ${bandOf(r.p)}">${r.n}</span></div>
      <div class="tl-card"><div class="round-head"><h3>Round ${r.n} <span class="muted" style="font-weight:400">· ${esc(r.mix)}</span></h3>
      <span class="tl-p num">${pct(r.p)}</span></div>
      <p class="delta muted">${Math.round((r.p - prev.p) * 100)} points · ${esc(r.chosen)}</p>
      <ol class="moves">${r.moves.map(moveItem).join("")}</ol>
      <p class="muted" style="font-size:13px">Meaning check: ${esc(r.fidelity)}</p></div></li>`);
  });
  if (v.pending) {
    const r = v.pending;
    steps.push(`<li class="tl-item" data-round="${r.n}"><div class="tl-rail"><span class="tl-node pending pulse">${r.n}</span></div>
      <div class="tl-card"><div class="round-head"><h3>Round ${r.n} <span class="muted" style="font-weight:400">· ${esc(r.mix)}</span></h3><span class="chip pulse">${r.stage}…</span></div>
      <ol class="moves">${r.moves.map(moveItem).join("")}</ol></div></li>`);
  }
  for (let n = v.measured.length + (v.pending ? 1 : 0) + (v.state === "start" ? 1 : 0); n <= MAX_ROUNDS; n++) {
    steps.push(`<li class="tl-item"><div class="tl-rail"><span class="tl-node pending" style="opacity:.5">${n}</span></div>
      <div class="tl-card" style="background:transparent;box-shadow:inset 0 0 0 1px var(--line)"><p class="muted" style="font-size:13.5px">Round ${n}: only if the goal is not reached and a good Path is left</p></div></li>`);
  }
  return steps;
}

/* C: band track up top, figures side by side, Moves as a matrix */
function variantC(v) {
  const c = current(v);
  const marks = v.measured.map((r) => `<span class="track-mark hit${r === c ? " cur" : ""}" data-round="${r.n}" style="left:${r.p * 100}%"></span>`).join("");
  const track = `<div class="track" aria-label="P(AI) ${pct(c.p)}"><div class="track-bar"><span></span><span></span><span></span></div>${marks}
      <span class="track-goal" style="left:${GOAL * 100}%" title="Goal: under 20%"></span><span class="track-lbl" style="left:${c.p * 100}%">${pct(c.p)}</span></div>
    <div class="track-scale"><span>0% human-shaped</span><span>goal 20%</span><span>30%</span><span>70%</span><span>AI-shaped 100%</span></div>`;

  let cols, rows;
  if (v.state === "start") {
    cols = v.offered.map((o) => ({ key: o.id, head: `Path ${o.id}${o.rec ? " ★" : ""}`, sub: o.mix, moves: o.moves, conflict: o.conflict }));
  } else {
    cols = v.measured.slice(1).map((r) => ({ key: r.n, round: r.n, head: `Round ${r.n}`, sub: pct(r.p), moves: r.moves }));
    if (v.pending) cols.push({ key: v.pending.n, round: v.pending.n, head: `Round ${v.pending.n}`, sub: "running…", moves: v.pending.moves, pending: true });
  }
  const feats = [];
  for (const col of cols) for (const m of col.moves) if (!feats.find((f) => f.f === m.f)) feats.push(m);
  rows = feats.map((m) => `<tr><th scope="row" style="font-weight:500;min-width:180px">${esc(m.what)}<div class="muted" style="font-weight:400;font-size:12px">${m.f}</div></th>
    ${cols.map((col) => {
      const mv = col.moves.find((x) => x.f === m.f);
      if (!mv) return `<td class="cell empty"${col.round != null ? ` data-round="${col.round}"` : ""}>·</td>`;
      return `<td class="cell"${col.round != null ? ` data-round="${col.round}"` : ""}><span class="kind ${mv.kind}">${KIND[mv.kind]}</span>
        <div class="fromto" style="margin-top:6px">${esc(mv.from)} →</div><div class="to">${esc(mv.to)}</div>
        <details><summary>Instruction</summary><p>${esc(mv.instr)}</p></details></td>`;
    }).join("")}</tr>`).join("");
  const head = `<tr><th>Feature</th>${cols.map((col) => `<th${col.round != null ? ` data-round="${col.round}"` : ""}>${col.head}<span class="num">${esc(col.sub)}</span>${col.conflict ? `<span class="conflict" style="text-transform:none;letter-spacing:0">conflicts with a constraint</span>` : ""}</th>`).join("")}</tr>`;
  const actions = v.state === "start" ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-go="running">Use Path A (recommended)</button><button type="button" class="btn ghost" data-go="running">Use Path B</button></div>` : "";

  return `<section class="card" style="display:grid;gap:8px">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start"><div style="display:grid;gap:4px;min-width:0">${postLine()}</div>
      <div style="text-align:right"><p class="eyebrow">P(AI) now</p><p class="num" style="font-size:28px;font-weight:600">${pct(c.p)}</p></div></div>
      ${track}<p style="font-size:13.5px;margin-top:6px">${esc(v.status)}</p></section>
    ${managerNote(v)}
    <div class="c-figs">
      <section class="card" style="display:grid;gap:10px"><p class="eyebrow">Structural map</p>${mapFig(v, false)}</section>
      <section class="card" style="display:grid;gap:10px"><p class="eyebrow">P(AI) by round</p>${chartFig(v, 280)}</section>
    </div>
    <section class="card" style="display:grid;gap:12px"><p class="eyebrow">${v.state === "start" ? "Compare the Paths" : "Moves by round"}</p>
      <div class="mx-wrap"><table class="mx"><thead>${head}</thead><tbody>${rows}</tbody></table></div>${actions}</section>
    ${v.state === "start" ? "" : keepList()}`;
}

const VARIANTS = [
  { key: "W", name: "Chosen: A + B timeline", render: variantW },
  { key: "A", name: "Stacked report", render: variantA },
  { key: "B", name: "Timeline + pinned figures", render: variantB },
  { key: "C", name: "Band track + Moves matrix", render: variantC },
];
const STATES = ["start", "running", "done"];
let vi = 0, st = "done";

function readHash() {
  const m = /^#([WABC])-(start|running|done)$/.exec(location.hash);
  if (m) { vi = VARIANTS.findIndex((x) => x.key === m[1]); st = m[2]; }
}
function render() {
  const v = view(st);
  document.getElementById("app").innerHTML = `<div style="display:grid;gap:16px">${VARIANTS[vi].render(v)}</div>`;
  document.getElementById("vlabel").textContent = `${VARIANTS[vi].key} · ${VARIANTS[vi].name}`;
  document.querySelectorAll(".switch [data-state]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.state === st)));
  try { history.replaceState(null, "", `#${VARIANTS[vi].key}-${st}`); } catch (e) {}
}
function go(dv, s) { vi = (vi + dv + VARIANTS.length) % VARIANTS.length; if (s) st = s; render(); }

document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.querySelectorAll(".switch [data-state]").forEach((b) => (b.onclick = () => go(0, b.dataset.state)));
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
document.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) go(0, b.dataset.go); });

const tip = document.getElementById("tip");
function hi(n) { document.querySelectorAll("[data-round]").forEach((el) => el.classList.toggle("hi", n != null && el.dataset.round === String(n))); }
function showTip(el, x, y) {
  const n = Number(el.dataset.round);
  const r = ROUNDS.find((q) => q.n === n);
  if (!r || !el.classList.contains("hit")) return;
  tip.innerHTML = `<b>${n === 0 ? "Original post" : "After round " + n}</b><br>P(AI) ${pct(r.p)} · ${BAND_NAME[bandOf(r.p)]}${r.moves ? `<br>${r.moves.length} Move${r.moves.length > 1 ? "s" : ""} · ${esc(r.mix)}` : ""}`;
  tip.hidden = false;
  const w = tip.offsetWidth;
  tip.style.left = `${Math.min(x + 14, innerWidth - w - 8)}px`;
  tip.style.top = `${y + 14}px`;
}
document.addEventListener("pointerover", (e) => { const el = e.target.closest("[data-round]"); hi(el ? el.dataset.round : null); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener("pointermove", (e) => { if (!tip.hidden) { const w = tip.offsetWidth; tip.style.left = `${Math.min(e.clientX + 14, innerWidth - w - 8)}px`; tip.style.top = `${e.clientY + 14}px`; } });
document.addEventListener("focusin", (e) => { const el = e.target.closest(".hit[data-round]"); if (el) { const b = el.getBoundingClientRect(); hi(el.dataset.round); showTip(el, b.right, b.bottom); } });
document.addEventListener("focusout", () => { tip.hidden = true; hi(null); });

readHash();
render();
</script>
